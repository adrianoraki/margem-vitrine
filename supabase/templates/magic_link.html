<h2>Seu acesso ao Margem</h2>
<p>Clique no botão para entrar. Funciona em qualquer aparelho e vale por 1 hora.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email&next=/painel"
    style="
      display: inline-block;
      background: #0b1220;
      color: #f2f4f7;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
    "
    >Entrar no Margem</a
  >
</p>
<p>Ou digite este código na tela de login:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px">{{ .Token }}</p>
<p style="color: #5b6474; font-size: 13px">Se você não pediu este acesso, ignore este e-mail.</p>
